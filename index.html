
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المسار نت</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
}
.header{
    background:#0d1b2a;
    color:white;
    padding:20px;
    text-align:center;
}
.dashboard{
    padding:20px;
}
.card{
    padding:18px;
    margin:10px 0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}
.expenses{ color:#cc8800;}           /* لون خط المصاريف */
.debts{ background:#8b0000; color:white;}   /* ديون عند الوكلاء غامق */
.payments{ background:#004d40; color:white;} /* تسديد غامق */
</style>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="header">
    المسار نت
</div>

<div class="dashboard">
    <div class="card expenses">المصاريف</div>
    <div class="card debts">ديون عند الوكلاء</div>
    <div class="card payments">تسديد الوكلاء</div>
</div>


<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('SW registration failed:', err);
    });
  });
})();
</script>

</body>
</html>
